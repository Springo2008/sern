<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Solver</title>
    <link rel="stylesheet" href="../../public/matrix/styleMatrix.css">
</head>
<body>
    <h1>2x2 Matrix Solver using Gauss-Jordan Elimination</h1>

<div id="eq1">
    <input type="number" value="3" id="x1" max="99" min="-99">x+
    <input type="number" value="5" id="y1" max="99" min="-99">y=
    <input type="number" value="9" id="c1" max="99" min="-99">

</div>

<!-- 3x + 5y = 9-->
<!-- 2x + 3y = 5-->
   
    
<div id="eq2">
    <input type="number" value="2" id="x2" max="99" min="-99">x+
    <input type="number" value="3" id="y2" max="99" min="-99">y=
    <input type="number" value="5" id="c2" max="99" min="-99">
</div>

<button id="solveBtn">Solve</button>

<div>
    <p id="answer">Answer:</p>
</div>
   
    
    <script src="../../public/matrix/scriptMatrix.js"></script>
</body>
</html>
